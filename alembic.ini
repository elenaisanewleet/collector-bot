[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os
# The URL is taken from DATABASE_URL at runtime (see migrations/env.py); this
# value is only a fallback for tooling that inspects the file statically.
sqlalchemy.url = sqlite+aiosqlite:///./collector_bot.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
